<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #21253a;
    --border: #2a2f45; --text: #e8eaf0; --muted: #6b7280;
    --accent: #4f8ef7; --green: #34d399; --red: #f87171; --amber: #fbbf24;
    --radius: 12px; --font: 'DM Sans', system-ui, sans-serif; --mono: 'DM Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; text-align: center; }
  .login-logo { font-size: 2.5rem; margin-bottom: 1rem; }
  .login-title { font-size: 1.3rem; font-weight: 600; margin-bottom: .25rem; }
  .login-sub { font-size: .85rem; color: var(--muted); margin-bottom: 2rem; }
  .login-card input[type="password"] {
    width: 100%; padding: .75rem 1rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: .95rem;
    outline: none; margin-bottom: .75rem; text-align: center; letter-spacing: .15em; transition: border-color .2s;
  }
  .login-card input[type="password"]:focus { border-color: var(--accent); }
  .btn-primary { width: 100%; padding: .75rem; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: var(--font); font-size: .95rem; font-weight: 600; cursor: pointer; transition: opacity .2s; }
  .btn-primary:hover { opacity: .88; }
  .login-error { font-size: .8rem; color: var(--red); margin-top: .5rem; min-height: 1.2em; }

  /* APP */
  #app { display: none; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: .9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-size: 1rem; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: .6rem; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background .3s; }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .btn-icon { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: .35rem .65rem; font-size: .8rem; cursor: pointer; font-family: var(--font); transition: color .2s, border-color .2s; }
  .btn-icon:hover { color: var(--text); border-color: var(--muted); }

  /* TABS */
  .tab-bar { display: flex; gap: 4px; padding: 1rem 1.25rem .25rem; overflow-x: auto; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab { padding: .4rem .9rem; border-radius: 20px; font-size: .82rem; font-weight: 500; white-space: nowrap; border: 1px solid transparent; cursor: pointer; background: none; color: var(--muted); font-family: var(--font); transition: all .15s; }
  .tab.active { background: var(--surface2); border-color: var(--border); color: var(--text); }

  main { padding: 1rem 1.25rem 6rem; max-width: 680px; margin: 0 auto; }

  /* CARDS */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem; }
  .card-label { font-size: .72rem; color: var(--muted); margin-bottom: .25rem; }
  .card-value { font-size: 1.45rem; font-weight: 600; font-family: var(--mono); }
  .card-value.green { color: var(--green); }
  .card-value.red { color: var(--red); }
  .card-value.blue { color: var(--accent); }
  .card-wide { grid-column: span 2; }

  /* FAB */
  .fab { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 20px rgba(79,142,247,.4); display: flex; align-items: center; justify-content: center; z-index: 100; transition: transform .2s; }
  .fab:hover { transform: scale(1.07); }

  /* DRAWER */
  .drawer-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; backdrop-filter: blur(2px); }
  .drawer-bg.open { display: flex; align-items: flex-end; justify-content: center; }
  .drawer { background: var(--surface); border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); padding: 1.25rem 1.25rem 2rem; width: 100%; max-width: 520px; animation: slideUp .22s ease; }
  @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
  .drawer-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto .9rem; }
  .drawer-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.1rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: .75rem; }
  .form-group { display: flex; flex-direction: column; gap: .35rem; }
  .form-group label { font-size: .78rem; color: var(--muted); }
  .form-group input, .form-group select { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-family: var(--font); font-size: .9rem; padding: .6rem .75rem; outline: none; transition: border-color .2s; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--bg); }
  .form-actions { display: flex; gap: .6rem; margin-top: 1rem; }
  .btn-save { flex: 1; padding: .7rem; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-family: var(--font); font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .2s; }
  .btn-save:hover { opacity: .88; }
  .btn-cancel { padding: .7rem 1.1rem; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 9px; font-family: var(--font); font-size: .9rem; cursor: pointer; }

  /* SECTION LABEL */
  .section-label { font-size: .72rem; color: var(--muted); letter-spacing: .04em; margin: 1.1rem 0 .5rem; }

  /* TX LIST */
  .tx-list { display: flex; flex-direction: column; gap: .5rem; }
  .tx-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem 1rem; display: flex; align-items: center; gap: .75rem; }
  .tx-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-desc { font-size: .88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: .75rem; color: var(--muted); margin-top: 1px; }
  .tx-amount { font-family: var(--mono); font-size: .95rem; font-weight: 500; }
  .tx-amount.income { color: var(--green); }
  .tx-amount.expense { color: var(--red); }
  .tx-del { background: none; border: none; color: var(--border); cursor: pointer; font-size: .85rem; padding: 4px; transition: color .2s; }
  .tx-del:hover { color: var(--red); }

  /* CAT */
  .cat-list { display: flex; flex-direction: column; gap: .5rem; }
  .cat-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem 1rem; }
  .cat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
  .cat-name { font-size: .85rem; font-weight: 500; }
  .cat-amt { font-family: var(--mono); font-size: .85rem; color: var(--red); }
  .cat-bar-bg { height: 5px; background: var(--border); border-radius: 3px; }
  .cat-bar { height: 5px; border-radius: 3px; background: var(--accent); transition: width .4s ease; }

  /* EMPTY */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-icon { font-size: 2rem; margin-bottom: .75rem; }
  .empty-text { font-size: .88rem; }

  /* TOAST */
  .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: .5rem 1.1rem; font-size: .82rem; color: var(--text); z-index: 500; opacity: 0; transition: opacity .25s; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* MODAL (Settings / Change Password) */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 300; backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 1.5rem; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.75rem 1.5rem; width: 100%; max-width: 380px; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }
  .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; }
  .modal-section { font-size: .72rem; color: var(--muted); letter-spacing: .04em; margin: 1.1rem 0 .6rem; }
  .modal input[type="password"], .modal input[type="text"] {
    width: 100%; padding: .65rem .85rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); font-family: var(--font); font-size: .9rem;
    outline: none; margin-bottom: .6rem; transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: .6rem; margin-top: 1.1rem; }
  .btn-danger { flex: 1; padding: .65rem; background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.25); border-radius: 9px; font-family: var(--font); font-size: .88rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  .btn-danger:hover { background: rgba(248,113,113,.2); }
  .pw-strength { height: 3px; border-radius: 2px; margin-bottom: .6rem; transition: all .3s; background: var(--border); }
  .pw-strength.weak { background: var(--red); width: 33%; }
  .pw-strength.medium { background: var(--amber); width: 66%; }
  .pw-strength.strong { background: var(--green); width: 100%; }
  .pw-strength-label { font-size: .75rem; color: var(--muted); margin-bottom: .6rem; }

  @media(max-width:400px) {
    .cards { grid-template-columns: 1fr; }
    .card-wide { grid-column: span 1; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">💰</div>
    <div class="login-title">Finance Tracker</div>
    <div class="login-sub">Enter your password to continue</div>
    <input type="password" id="pw-input" placeholder="••••••••••" autocomplete="current-password">
    <button class="btn-primary" onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="topbar-title">💰 Finance</span>
    <div class="topbar-right">
      <div class="sync-dot" id="sync-dot" title="Sync status"></div>
      <button class="btn-icon" onclick="loadData()">↻ Sync</button>
      <button class="btn-icon" onclick="openSettings()">⚙ Settings</button>
      <button class="btn-icon" onclick="logout()">🔒 Lock</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="setTab('day',this)">Today</button>
    <button class="tab" onclick="setTab('week',this)">This week</button>
    <button class="tab" onclick="setTab('month',this)">This month</button>
    <button class="tab" onclick="setTab('quarter',this)">This quarter</button>
    <button class="tab" onclick="setTab('year',this)">This year</button>
    <button class="tab" onclick="setTab('all',this)">All time</button>
  </div>

  <main>
    <div class="cards">
      <div class="card">
        <div class="card-label">Total Income</div>
        <div class="card-value green" id="m-income">GHS 0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Total Expenses</div>
        <div class="card-value red" id="m-expense">GHS 0.00</div>
      </div>
      <div class="card card-wide">
        <div class="card-label">Net Balance</div>
        <div class="card-value blue" id="m-balance">GHS 0.00</div>
      </div>
    </div>

    <div class="section-label">SPENDING BY CATEGORY</div>
    <div class="cat-list" id="cat-list">
      <div class="empty"><div class="empty-icon">📊</div><div class="empty-text">No data yet</div></div>
    </div>

    <div class="section-label" id="tx-label">TRANSACTIONS</div>
    <div class="tx-list" id="tx-list">
      <div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No transactions in this period</div></div>
    </div>
  </main>
</div>

<!-- FAB -->
<button class="fab" onclick="openDrawer()" id="fab">＋</button>

<!-- ADD DRAWER -->
<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>
    <div class="drawer-title">Add Transaction</div>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="f-type">
          <option value="Income">Income</option>
          <option value="Expense" selected>Expense</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (GHS)</label>
        <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="f-cat">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills &amp; Utilities</option>
          <option>Shopping</option>
          <option>Health</option>
          <option>Entertainment</option>
          <option>Savings</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="What was this for?">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeDrawer()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()" id="btn-save">Save</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settings-modal" onclick="closeSettings()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">⚙ Settings</div>

    <div class="modal-section">CHANGE PASSWORD</div>
    <input type="password" id="s-current" placeholder="Current password">
    <input type="password" id="s-new" placeholder="New password" oninput="checkStrength()">
    <div class="pw-strength" id="pw-strength"></div>
    <div class="pw-strength-label" id="pw-strength-label"></div>
    <input type="password" id="s-confirm" placeholder="Confirm new password">
    <button class="btn-save" style="width:100%; margin-top:.25rem" onclick="changePassword()">Update Password</button>

    <div class="modal-section">DANGER ZONE</div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="clearAllData()">🗑 Clear all data</button>
      <button class="btn-cancel" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbye0J61QKhmFMPNixeZkAE9-JPlWyr103xErWaB3nm9rPp4dRJ_4Mge8EilJ1ByG5p3/exec';

// Password stored in localStorage so user can change it from the UI
// Default is 'mypassword123' — user changes it in Settings
function getPassword() {
  return localStorage.getItem('app_password') || 'mypassword123';
}
function setPassword(pw) {
  localStorage.setItem('app_password', pw);
}

let allData = [];
let curTab  = 'day';
const today = new Date();

// ── AUTH ──────────────────────────────────────────────────────────────
function tryLogin() {
  const val = document.getElementById('pw-input').value;
  if (val === getPassword()) {
    sessionStorage.setItem('auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('fab').style.display = 'flex';
    setTodayDate();
    loadData();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password. Try again.';
    document.getElementById('pw-input').value = '';
  }
}
function logout() {
  sessionStorage.removeItem('auth');
  location.reload();
}
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});
if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  setTodayDate();
  loadData();
}

// ── SETTINGS / CHANGE PASSWORD ────────────────────────────────────────
function openSettings()  { document.getElementById('settings-modal').classList.add('open'); }
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
  document.getElementById('s-current').value = '';
  document.getElementById('s-new').value     = '';
  document.getElementById('s-confirm').value = '';
  document.getElementById('pw-strength').className = 'pw-strength';
  document.getElementById('pw-strength-label').textContent = '';
}

function checkStrength() {
  const pw  = document.getElementById('s-new').value;
  const bar = document.getElementById('pw-strength');
  const lbl = document.getElementById('pw-strength-label');
  if (!pw) { bar.className = 'pw-strength'; lbl.textContent = ''; return; }
  const strong = pw.length >= 12 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
  const medium = pw.length >= 8 && (/[A-Z]/.test(pw) || /[0-9]/.test(pw));
  if (strong)       { bar.className = 'pw-strength strong'; lbl.textContent = 'Strong'; }
  else if (medium)  { bar.className = 'pw-strength medium'; lbl.textContent = 'Medium'; }
  else              { bar.className = 'pw-strength weak';   lbl.textContent = 'Weak'; }
}

function changePassword() {
  const current = document.getElementById('s-current').value;
  const newPw   = document.getElementById('s-new').value;
  const confirm = document.getElementById('s-confirm').value;

  if (current !== getPassword()) { toast('Current password is incorrect'); return; }
  if (newPw.length < 6)          { toast('New password must be at least 6 characters'); return; }
  if (newPw !== confirm)         { toast('Passwords do not match'); return; }

  setPassword(newPw);
  closeSettings();
  toast('✅ Password updated successfully!');
}

function clearAllData() {
  if (!confirm('This will permanently delete ALL your transactions. Are you sure?')) return;
  allData = [];
  localStorage.removeItem('finance_data');
  render();
  closeSettings();
  toast('All data cleared');
}

// ── DATE ──────────────────────────────────────────────────────────────
function setTodayDate() {
  document.getElementById('f-date').value = today.toISOString().slice(0,10);
}
function isoStr(d) { return d.toISOString().slice(0,10); }

function inTab(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const t = today;
  if (curTab === 'day')     return dateStr === isoStr(t);
  if (curTab === 'week') {
    const mon = new Date(t);
    mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
    mon.setHours(0,0,0,0);
    return d >= mon;
  }
  if (curTab === 'month')   return d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
  if (curTab === 'quarter') {
    const q = Math.floor(t.getMonth()/3);
    return Math.floor(d.getMonth()/3) === q && d.getFullYear() === t.getFullYear();
  }
  if (curTab === 'year')    return d.getFullYear() === t.getFullYear();
  return true;
}
function setTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── SYNC ──────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  document.getElementById('sync-dot').className = 'sync-dot' + (s === 'syncing' ? ' syncing' : s === 'error' ? ' error' : '');
}

async function loadData() {
  setSyncStatus('syncing');
  try {
    const res  = await fetch(SCRIPT_URL + '?action=get');
    const json = await res.json();
    allData = (json.data || []).map(r => ({
      id:          Number(r.id),
      date:        r.date,
      type:        r.type,
      category:    r.category,
      amount:      Number(r.amount),
      description: r.description,
    }));
    localStorage.setItem('finance_data', JSON.stringify(allData));
    setSyncStatus('ok');
  } catch(e) {
    allData = JSON.parse(localStorage.getItem('finance_data') || '[]');
    setSyncStatus('error');
    toast('Offline — showing cached data');
  }
  render();
}

async function saveEntry() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  const desc   = document.getElementById('f-desc').value.trim();
  const type   = document.getElementById('f-type').value;
  const cat    = document.getElementById('f-cat').value;
  const date   = document.getElementById('f-date').value;

  if (!amount || amount <= 0) { toast('Enter a valid amount'); return; }
  if (!desc)                  { toast('Add a description'); return; }

  const entry = { id: Date.now(), date, type, category: cat, amount, description: desc };
  const btn   = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Saving…';

  setSyncStatus('syncing');
  try {
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'add', entry }) });
    allData.push(entry);
    localStorage.setItem('finance_data', JSON.stringify(allData));
    setSyncStatus('ok');
    toast('Saved ✓');
  } catch(e) {
    allData.push(entry);
    localStorage.setItem('finance_data', JSON.stringify(allData));
    setSyncStatus('error');
    toast('Saved locally — will sync when online');
  }

  btn.disabled = false; btn.textContent = 'Save';
  closeDrawer();
  render();
  document.getElementById('f-amount').value = '';
  document.getElementById('f-desc').value   = '';
  document.getElementById('f-type').value   = 'Expense';
  setTodayDate();
}

async function deleteEntry(id) {
  if (!confirm('Delete this transaction?')) return;
  allData = allData.filter(e => e.id !== id);
  localStorage.setItem('finance_data', JSON.stringify(allData));
  setSyncStatus('syncing');
  try {
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'delete', id }) });
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('error'); }
  render();
  toast('Deleted');
}

// ── RENDER ────────────────────────────────────────────────────────────
function fmt(n) {
  return 'GHS ' + Number(n).toLocaleString('en-GH', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
const CAT_ICONS = {
  Food:'🍔', Transport:'🚗', 'Bills & Utilities':'💡', Shopping:'🛍️',
  Health:'💊', Entertainment:'🎬', Savings:'🏦', Income:'💵', Other:'📌'
};

function render() {
  const filtered = allData.filter(e => inTab(e.date))
    .sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

  const income  = filtered.filter(e => e.type === 'Income').reduce((s,e)  => s + e.amount, 0);
  const expense = filtered.filter(e => e.type === 'Expense').reduce((s,e) => s + e.amount, 0);
  const balance = income - expense;

  document.getElementById('m-income').textContent  = fmt(income);
  document.getElementById('m-expense').textContent = fmt(expense);
  const balEl = document.getElementById('m-balance');
  balEl.textContent = fmt(balance);
  balEl.className   = 'card-value ' + (balance >= 0 ? 'blue' : 'red');

  // Categories
  const cats = {};
  filtered.filter(e => e.type === 'Expense').forEach(e => {
    cats[e.category] = (cats[e.category] || 0) + e.amount;
  });
  const sortedCats = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const maxCat = sortedCats[0]?.[1] || 1;
  const catEl  = document.getElementById('cat-list');
  catEl.innerHTML = !sortedCats.length
    ? '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">No expense data</div></div>'
    : sortedCats.map(([cat, amt]) => `
        <div class="cat-item">
          <div class="cat-top">
            <span class="cat-name">${CAT_ICONS[cat]||'📌'} ${cat}</span>
            <span class="cat-amt">${fmt(amt)}</span>
          </div>
          <div class="cat-bar-bg"><div class="cat-bar" style="width:${Math.round(amt/maxCat*100)}%"></div></div>
        </div>`).join('');

  // Transactions
  document.getElementById('tx-label').textContent =
    `${curTab === 'all' ? 'ALL TIME' : curTab.toUpperCase()} — ${filtered.length} TRANSACTION${filtered.length !== 1 ? 'S' : ''}`;
  const txEl = document.getElementById('tx-list');
  txEl.innerHTML = !filtered.length
    ? '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No transactions in this period</div></div>'
    : filtered.map(e => `
        <div class="tx-item">
          <div class="tx-icon" style="background:${e.type==='Income'?'rgba(52,211,153,.12)':'rgba(248,113,113,.12)'}">
            ${e.type === 'Income' ? '💵' : (CAT_ICONS[e.category]||'📌')}
          </div>
          <div class="tx-info">
            <div class="tx-desc">${e.description}</div>
            <div class="tx-meta">${e.category} · ${new Date(e.date+'T00:00:00').toLocaleDateString('en-GH',{day:'numeric',month:'short',year:'numeric'})}</div>
          </div>
          <span class="tx-amount ${e.type==='Income'?'income':'expense'}">
            ${e.type==='Income'?'+':'−'}${fmt(e.amount)}
          </span>
          <button class="tx-del" onclick="deleteEntry(${e.id})" title="Delete">✕</button>
        </div>`).join('');
}

function openDrawer()  { document.getElementById('drawer-bg').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer-bg').classList.remove('open'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
